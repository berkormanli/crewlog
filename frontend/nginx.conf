# nginx config for the CrewLog frontend.
#
# - Serves the Vite SPA (history-mode fallback to index.html).
# - Proxies /api/* to the Fastify backend so the browser only talks to one
#   origin (this avoids CORS preflights and keeps cookies first-party).
# - The backend service DNS name is configurable via BACKEND_UPSTREAM
#   (default: http://backend:4000 — matches the production compose file).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crewlog_backend {
    server BACKEND_UPSTREAM;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reasonable defaults for an SPA shell.
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets emitted by Vite under /assets/.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback — anything that isn't a real file is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api/* to the Fastify backend.
    # Uploads can be large; bump the body size to match UPLOAD_MAX_BYTES (25M).
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://crewlog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    # Tiny health endpoint for the orchestrator.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}