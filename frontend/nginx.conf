map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS resolver — re-resolves service names on each
# request instead of caching forever, so backend container restarts
# (redeploys, recreations) don't leave nginx pointing at a dead IP.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 32m;

    location /api/ {
        # Using a variable forces nginx to resolve DNS per-request via
        # the resolver above, instead of once at startup like a static
        # `upstream { server ...; }` block would.
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}